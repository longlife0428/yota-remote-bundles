<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="normal">
<title>host shell</title>
<style>
:root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
body.has-game { background: #000; }

#game { position: fixed; top: var(--sat); right: var(--sar); bottom: var(--sab); left: var(--sal); width: calc(100% - var(--sal) - var(--sar)); height: calc(100% - var(--sat) - var(--sab)); border: 0; background: #000; }

/* 選單鈕 原本的退出鈕 位置與樣式沿用 內容換成三條線 */
#menu-btn { position: fixed; z-index: 10; top: calc(var(--sat) + 8px); left: calc(var(--sal) + 8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 44px; height: 32px; padding: 0; border: 1px solid rgba(255,255,255,.35); border-radius: 16px; background: rgba(0,0,0,.55); cursor: pointer; user-select: none; }
#menu-btn i { display: block; width: 16px; height: 2px; border-radius: 1px; background: #fff; }
#menu-btn.right { left: auto; right: calc(var(--sar) + 8px); }
#menu-btn.hidden { display: none; }

/* 共用彈窗 照 entry Core 的 PopupProperty.prefab 與 SystemMenu／LeaveConfirm／AutoPlay／SeatLobby 四個彈窗 prefab 一比一重做
   外框用素材原尺寸排版 座標換算自 prefab 再整塊縮放 Cocos 版外框本身就縮成 0.5 倍
   Cocos 按鈕的顏色過渡 normal 214 hover 211 pressed 255 disabled 124 用 brightness 對應 只套在按鈕底圖上 */
#popup-layer { position: fixed; z-index: 15; inset: 0; display: none; }
#popup-layer.show { display: block; }
.popup-frame { position: absolute; left: 50%; top: 50%; background: url(popups/Popups_bg01.png) no-repeat; background-size: 100% 100%; font-family: Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; color: #fff; user-select: none; }
.popup-frame div { position: absolute; white-space: nowrap; }
.popup-title-en { left: 0; top: 35px; width: 100%; height: 52px; font-size: 52px; line-height: 52px; font-weight: 700; text-align: center; color: rgb(248,236,205); }
.popup-title { left: 0; top: 101px; width: 100%; height: 73px; font-size: 60px; line-height: 73px; font-weight: 700; text-align: center; }
.popup-close { position: absolute; right: -62px; top: -41px; width: 180px; height: 180px; padding: 0; border: 0; background: url(popups/Popups_cancel_button.png) no-repeat; background-size: 100% 100%; filter: brightness(.839); cursor: pointer; }
.popup-close:hover { filter: brightness(.827); }
.popup-close:active { filter: none; }
/* 遊戲說明 版面照遊戲說明預覽的 info-panel 上面一條標題列 下面是頁面 */
.info-panel { position: absolute; inset: 0; display: flex; flex-direction: column; background: #080808; color: #fff; font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif; }
.panel-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #080808; padding: 8px 16px; min-height: 43px; border-bottom: 1px solid #3a3019; color: #fff; font-size: 11px; }
.panel-bar > span { display: flex; align-items: center; gap: 8px; }
.panel-bar i { width: 5px; height: 5px; border: 1px solid #d8b75a; transform: rotate(45deg); }
.panel-bar button { background: transparent; color: #fff; border: 0; display: flex; align-items: center; gap: 12px; padding: 4px 3px; font-size: 11px; cursor: pointer; }
.panel-bar b { font: 22px/1 "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif; color: #ffe16a; }
.info-panel iframe { width: 100%; height: 100%; flex: 1; min-height: 0; display: block; border: 0; background: #080808; }
.popup-back { left: 50px; top: 190px; width: 210px; height: 80px; cursor: pointer; }
.popup-back::before { content: ''; position: absolute; inset: 0; border: 20px solid transparent; border-image: url(popups/popups_button_bg.png) 20 fill stretch; filter: brightness(.839); }
.popup-back:hover::before { filter: brightness(.827); }
.popup-back:active::before { filter: none; }
.popup-back .icon { left: 0; top: 0; width: 60px; height: 80px; background: url(popups/popups_button_highlight.png) no-repeat; background-size: 100% 100%; }
.popup-back .label { left: 60px; top: 15px; width: 150px; height: 50px; font-size: 26px; line-height: 50px; text-align: center; color: rgb(248,236,205); }

/* 選項列 SystemMenu 與 LeaveConfirm 共用 System_menu_options 那套 */
.opt { position: relative !important; width: 470px; height: 120px; cursor: pointer; }
.opt.wide { width: 975px; }
.opt::before { content: ''; position: absolute; inset: 0; border: 30px solid transparent; border-image: url(popups/System_menu_options_bg.png) 30 fill stretch; filter: brightness(.839); }
.opt:hover::before { filter: brightness(.827); }
.opt:active::before { filter: none; }
.opt.disabled { cursor: default; }
.opt.disabled::before { filter: brightness(.486); }
.opt .icon { left: 0; top: 0; width: 133px; height: 120px; background-size: 100% 100%; }
.opt .name { left: 164px; top: 21px; width: 306px; height: 50px; font-size: 40px; line-height: 50px; font-weight: 700; overflow: hidden; }
.opt .desc { left: 164px; top: 72px; width: 306px; height: 24px; font-size: 20px; line-height: 24px; overflow: hidden; }
.opt.wide .name, .opt.wide .desc { width: 811px; }
.opt .switch { left: 350px; top: 16px; width: 100px; height: 44px; background: url(popups/System_menu_music_off_button.png) no-repeat; background-size: 100% 100%; }
.opt.on .switch { background-image: url(popups/System_menu_music_on_button.png); }
.opt .disable { inset: 0; display: none; border: 30px solid transparent; border-image: url(popups/System_menu_options_enable.png) 30 fill stretch; }
.opt.disabled .disable { display: block; }
.sm-list { left: 112.5px; top: 215px; display: grid; grid-template-columns: 470px 470px; gap: 25px 35px; }
.sm-list .opt.wide { grid-column: 1 / 3; }
.lc-list { left: 112.5px; top: 182px; display: flex; flex-direction: column; gap: 25px; }

/* AutoPlay 3x2 局數 選了就等於確認 */
.ap-grid { left: 50px; top: 215px; display: grid; grid-template-columns: 350px 350px 350px; gap: 20px 25px; }
.ap-item { position: relative !important; width: 350px; height: 190px; background: url(popups/Autoplay_bg_enable.png) no-repeat; background-size: 100% 100%; cursor: pointer; }
.ap-item.on::before { content: ''; position: absolute; left: -37px; top: -37px; width: 424px; height: 264px; background: url(popups/Autoplay_bg_hover.png) no-repeat; background-size: 100% 100%; }
.ap-item .num { left: 0; top: 30px; width: 350px; height: 131px; font-size: 75px; line-height: 75px; font-weight: 700; text-align: center; }
.ap-item .unit { left: 0; top: 121px; width: 350px; height: 40px; font-size: 40px; line-height: 40px; font-weight: 700; text-align: center; color: rgb(248,236,205); }
.ap-hint { left: 0; top: 624px; width: 100%; height: 50px; font-size: 28px; line-height: 50px; font-weight: 700; text-align: center; color: rgb(76,54,28); }

/* SeatLobby 外框 1600x1000 左邊座位清單 右邊詳細看板 */
.sl-filter { top: 190px; width: 210px; height: 80px; background: url(popups/Seat_lobby_button_enable02.png) no-repeat; background-size: 100% 100%; cursor: pointer; }
.sl-filter.on { background: none; }
.sl-filter.on::before { content: ''; position: absolute; left: -8.5px; top: -8.5px; width: 227px; height: 97px; background: url(popups/Seat_lobby_button_hover02.png) no-repeat; background-size: 100% 100%; }
.sl-filter .label { left: 15.5px; top: 23.5px; width: 111px; height: 33px; font-size: 26px; line-height: 33px; text-align: center; }
.sl-filter.on .label { color: rgb(248,236,205); }
.sl-filter .badge { left: 135px; top: 15px; width: 60px; height: 50px; background: url(popups/Seat_lobby_button_number_bg.png) no-repeat; background-size: 100% 100%; font-size: 26px; line-height: 50px; text-align: center; color: rgb(248,236,205); }
.sl-panel::before { content: ''; position: absolute; inset: 0; border: 20px solid transparent; border-image: url(popups/Seat_lobby_bg01.png) 20 fill stretch; }
.sl-list { left: 50px; top: 288px; width: 940px; height: 690px; }
.sl-info { left: 1008px; top: 288px; width: 550px; height: 690px; }
.sl-card { width: 140px; height: 180px; cursor: pointer; }
.sl-card.locked { cursor: default; }
.sl-card .bg { left: 0; top: 0; width: 140px; height: 180px; background-size: 100% 100%; }
.sl-card.selected .bg { left: -13.5px; top: -13.5px; width: 167px; height: 207px; }
.sl-card .id { left: 10px; top: 6px; width: 57px; height: 29px; font-size: 30px; line-height: 29px; font-weight: 700; text-align: center; }
.sl-card .status { left: 78px; top: 16px; width: 57px; height: 22px; font-size: 16px; line-height: 16px; text-align: center; color: rgb(248,236,205); }
.sl-card .mid { left: 0; top: 0; width: 140px; height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.sl-card .mid div { position: static; }
.sl-card .icon { background-size: 100% 100%; }
.sl-card .hint { font-size: 16px; line-height: 18px; }
.sl-card .rtp { left: 10px; top: 154px; width: 33px; height: 18px; font-size: 16px; line-height: 18px; font-weight: 700; text-align: center; color: rgb(248,236,205); }
.sl-card .pct { right: 10px; top: 154px; width: 57px; height: 18px; font-size: 16px; line-height: 18px; font-weight: 700; text-align: right; }
.sl-footer { left: 0; top: 606px; width: 940px; height: 84px; background: url(popups/Seat_lobby_footer_bg.png) no-repeat; background-size: 100% 100%; }
.sl-page-label { left: 32px; top: 25.5px; height: 33px; font-size: 26px; line-height: 33px; font-weight: 700; }
.sl-pages { right: 48px; top: 14px; display: flex; gap: 5px; }
.sl-page { position: relative !important; width: 56px; height: 56px; background: url(popups/Seat_lobby_room_pages_bg_enable.png) no-repeat; background-size: 100% 100%; font-size: 26px; line-height: 56px; font-weight: 700; text-align: center; color: rgb(204,159,83); cursor: pointer; }
.sl-page.on { background-image: url(popups/Seat_lobby_room_pages_bg_hover.png); color: #fff; }
.sl-tip, .sl-detail { left: 0; top: 0; width: 550px; height: 514px; }
.sl-tip .icon { left: 225.5px; top: 135px; width: 99px; height: 73px; background: url(popups/Seat_lobby_room_gameroom_icon.png) no-repeat; background-size: 100% 100%; }
.sl-tip .prompt { left: 0; top: 245.9px; width: 550px; height: 38px; font-size: 30px; line-height: 38px; font-weight: 700; text-align: center; color: rgb(248,236,205); }
.sl-tip .hint { left: 135px; top: 300.1px; width: 280px; font-size: 24px; line-height: 24px; text-align: center; white-space: normal; color: rgb(200,187,154); }
.sl-id { left: 0; top: 0; width: 550px; height: 100px; background: url(popups/Seat_lobby_banner02.png) no-repeat; background-size: 100% 100%; }
.sl-id .label { left: 29.9px; top: 25px; height: 50px; font-size: 40px; line-height: 50px; font-weight: 700; }
.sl-id .state { left: 380px; top: 20px; width: 140px; height: 60px; background: url(popups/Seat_lobby_state_bg.png) no-repeat; background-size: 100% 100%; font-size: 26px; line-height: 60px; text-align: center; }
.sl-stat { left: 0; width: 550px; height: 102px; background: url(popups/Seat_lobby_lightup_bg.png) no-repeat; background-size: 100% 100%; }
.sl-stat .title { left: 28px; top: 4px; height: 25px; font-size: 20px; line-height: 25px; color: rgb(248,236,205); }
.sl-stat .item { top: 29px; width: 162px; height: 70px; }
.sl-stat .item .caption { left: 0; top: 5px; width: 162px; height: 32px; font-size: 20px; line-height: 32px; color: rgb(248,236,205); }
.sl-stat .item .value { left: 0; top: 29px; height: 33px; display: flex; align-items: flex-end; gap: 10px; color: rgb(248,236,205); font-weight: 700; }
.sl-stat .item .value div { position: static; }
.sl-stat .item .count { font-size: 40px; line-height: 33px; }
.sl-stat .item .unit { font-size: 18px; line-height: 23px; }
.sl-stat .item .line { left: 157px; top: 0; width: 5px; height: 70px; background: url(popups/Seat_lobby_button_enable01.png) no-repeat; background-size: 100% 100%; }
.sl-action-hint { left: 0; top: 514px; width: 550px; height: 60px; background: url(popups/Seat_lobby_banner01.png) no-repeat; background-size: 100% 100%; }
.sl-action-hint .label { left: 19px; top: 15px; height: 30px; font-size: 24px; line-height: 30px; color: rgb(200,187,154); }
.sl-btn { top: 588px; width: 210px; height: 80px; background: url(popups/Seat_lobby_button_enable02.png) no-repeat; background-size: 100% 100%; cursor: pointer; }
.sl-btn:not(.disabled):hover, .sl-btn:not(.disabled):active { background: none; }
.sl-btn:not(.disabled):hover::before, .sl-btn:not(.disabled):active::before { content: ''; position: absolute; left: -8.5px; top: -8.5px; width: 227px; height: 97px; background: url(popups/Seat_lobby_button_hover02.png) no-repeat; background-size: 100% 100%; }
.sl-btn.disabled { cursor: default; }
.sl-btn .label { left: 0; top: 0; width: 210px; height: 80px; font-size: 40px; line-height: 80px; font-weight: 700; text-align: center; }

#mask { position: fixed; z-index: 20; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
#mask.show { display: flex; }
#dialog { width: min(86vw, 360px); padding: 22px 20px 18px; border-radius: 12px; background: #253448; color: #fff; text-align: center; }
#dialog h1 { margin: 0 0 10px; font-size: 18px; font-weight: 600; }
#dialog p { margin: 0 0 18px; font-size: 15px; line-height: 1.5; color: #d8e0ea; white-space: pre-line; }
#dialog .row { display: flex; gap: 12px; }
#dialog button { flex: 1; height: 40px; border-radius: 20px; font-size: 15px; cursor: pointer; }
#dialog .cancel { border: 2px solid #797979; background: transparent; color: #fff; }
#dialog .ok { border: 0; background: #60c4cf; color: #0c1620; }

#loading { position: fixed; z-index: 30; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,.5); color: #fff; font-size: 15px; }
#loading.show { display: flex; }
#loading i { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#tag { position: fixed; z-index: 5; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; color: #fff; font-size: 36px; font-weight: 700; pointer-events: none; }
body.has-game #tag { display: flex; }
#tag.done { display: none !important; }
#tag small { font-size: 14px; font-weight: 400; opacity: .7; }

#toast { position: fixed; z-index: 40; left: 50%; bottom: calc(var(--sab) + 40px); max-width: 80vw; padding: 10px 16px; border-radius: 8px; background: rgba(0,0,0,.8); color: #fff; font-size: 14px; transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
</style>

    // 跟 Cocos TableListFakeStats 同一套 同一桌算出來的數字兩邊一致

    }

    function seededRandom(seed) {
        var x = Math.sin(seed) * 10000;

    function fakeTables(count) {

        for (var i = 0; i < count; i++) {
            tables.push({ tableId: String(i + 1), seatState: Math.random() < 0.5 ? SEAT_EMPTY : SEAT_FULL, isReserved: false });

        var reserved = {};
        var reservedCount = Math.min(10, tables.length);
        while (Object.keys(reserved).length < reservedCount) reserved[Math.floor(Math.random() * tables.length)] = true;
        Object.keys(reserved).forEach(function (index) {
            tables[index].seatState = SEAT_EMPTY;
            tables[index].isReserved = true;
        });
        return tables;
    }

    function normalizeTables(list) {

        function renderCard(table, index) {

            id.appendChild(h('div', 'state', seatStatusText(table)));
            detail.appendChild(id);
            detail.appendChild(statRow(100, text.statFreeGame, [
                { caption: text.fgNotStarted, count: rand(10, 999), unit: text.statSpin },
                { caption: text.fgPrevious1, count: rand(10, 999), unit: text.statSpin },
                { caption: text.fgPrevious2, count: rand(10, 999), unit: text.statSpin }
            ]));
            var days = [text.statToday, text.statThreeDay, text.statSevenDay];
            detail.appendChild(statRow(202, text.statRtp, days.map(function (day) { return { caption: day, count: rand(85, 98) + '%' }; })));
            detail.appendChild(statRow(304, text.statHitRate, days.map(function (day) { return { caption: day, count: rand(20, 45) + '%' }; })));
            detail.appendChild(statRow(406, text.statTotalBet, days.map(function (day) { return { caption: day, count: rand(1000, 999999).toLocaleString('en-US') }; })));
        }

        function render() {
            var list = visibleTables();
            var totalPages = Math.max(1, Math.ceil(list.length / SEATS_PER_PAGE));
            state.page = Math.min(Math.max(0, state.page), totalPages - 1);

            filterAll.classList.toggle('on', state.filter === 'all');
            filterEmpty.classList.toggle('on', state.filter === 'empty');
            filterAll.querySelector('.badge').textContent = tables.length;
            filterEmpty.querySelector('.badge').textContent = tables.filter(function (t) { return t.seatState === SEAT_EMPTY; }).length;

            cards.textContent = '';
            list.slice(state.page * SEATS_PER_PAGE, (state.page + 1) * SEATS_PER_PAGE).forEach(function (table, index) {
                cards.appendChild(renderCard(table, index));
            });

            pageLabel.textContent = fill(text.seatPage, { page: state.page + 1, total: totalPages, count: list.length });
            pages.textContent = '';
            for (var p = 0; p < totalPages; p++) {
                (function (page) {
                    var button = h('div', 'sl-page' + (page === state.page ? ' on' : ''), String(page + 1));
                    button.addEventListener('click', function () {
                        if (state.page === page) return;
                        state.page = page;
                        render();
                    });
                    pages.appendChild(button);
                })(p);
            }

            var table = selectedTable();
            tip.style.display = table ? 'none' : '';
            detail.style.display = table ? '' : 'none';
            if (table) renderDetail(table);
            var available = !!table && isSeatAvailable(table);
            reserveBtn.classList.toggle('disabled', !available);
            enterBtn.classList.toggle('disabled', !available);
        }

        // 保留 後端還沒有協定 先在畫面上把這桌標成保留中 再通知大廳
        reserveBtn.addEventListener('click', function () {
            var table = selectedTable();
            if (!table || !isSeatAvailable(table)) return;
            table.isReserved = true;
            render();
            emit('seat-reserve', { tableId: table.tableId });
        });
        enterBtn.addEventListener('click', function () {
            var table = selectedTable();
            if (!table || !isSeatAvailable(table)) return;
            // 先通知入座再關 大廳才分得出入座與取消
            emit('seat-enter', { tableId: table.tableId });
            closePopup('done');
        });

        render();
    }

    function applySafe(safe) {
        var root = document.documentElement.style;
        if (safe.top != null) root.setProperty('--sat', safe.top + 'px');
        if (safe.right != null) root.setProperty('--sar', safe.right + 'px');
        if (safe.bottom != null) root.setProperty('--sab', safe.bottom + 'px');
        if (safe.left != null) root.setProperty('--sal', safe.left + 'px');
    }

    // 遮罩隱藏原因 ready 遊戲通知 timeout 逾時
    function hideCover(reason) {
        if (cover.classList.contains('done')) return;
        cover.classList.add('done');
        clearTimeout(coverTimer);
        emit('cover-hidden', { reason: reason });
        // 進遊戲先選座 遊戲露出來的那一刻開 不強制選 關掉照樣進遊戲 已經有別的彈窗開著就不搶
        if (gameFrame && !currentPopup) showSeatLobby({});
    }

    // 握手 告訴遊戲殼頁在 以及它的代號與語言
    function sendHello() {
        gameFrame.contentWindow.postMessage({ source: 'host-shell', type: 'hello', payload: { gameId: gameId, lang: lang, settings: { music: settings.music, sound: settings.sound } } }, '*');
    }

    // 大廳與遊戲都能呼叫的指令 同一套名稱同一套參數
    var COMMANDS = ['show-system-menu', 'show-auto-play', 'show-seat-lobby', 'show-exit', 'show-confirm', 'show-alert', 'close-dialog', 'show-loading', 'hide-loading', 'show-toast'];
    // 目前彈窗是誰叫的 host 或 game 結果回給它
    var dialogCaller = 'host';

    function openDialog(options, caller) {
        dialogId = options.id || '';
        dialogCaller = caller || 'host';
        dlgTitle.textContent = options.title || '';
        dlgMessage.textContent = options.message || '';
        dlgOk.textContent = options.confirm || text.ok;
        dlgCancel.textContent = options.cancel || text.cancel;
        dlgCancel.style.display = options.alert ? 'none' : '';
        mask.classList.add('show');
        emit('dialog-open', { id: dialogId });
    }

    function closeDialog(result) {
        if (!mask.classList.contains('show')) return;
        mask.classList.remove('show');
        var id = dialogId;
        var caller = dialogCaller;
        dialogId = '';
        emit('dialog-close', { id: id, result: result });
        if (caller === 'game' && gameFrame) {
            gameFrame.contentWindow.postMessage({ source: 'host-shell', type: 'dialog-result', payload: { id: id, result: result } }, '*');
        }
        // 退出確認 不管誰叫的 都通知大廳決定要不要離開
        if (id === 'exit') {
            if (result === 'ok') emit('exit-confirm', { via: 'dialog' });
            else emit('exit-cancel');
        }
    }

    function showToast(message, ms) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, ms || 2000);
    }

    function execute(type, payload, caller) {
        switch (type) {
            case 'show-system-menu':
                showSystemMenu();
                break;
            case 'show-auto-play':
                showAutoPlay(payload, caller);
                break;
            case 'show-seat-lobby':
                showSeatLobby(payload);
                break;
            case 'show-exit':
                openDialog({ id: 'exit', title: text.title, message: text.message, confirm: text.confirm, cancel: text.cancel }, caller);
                break;
            case 'show-confirm':
                openDialog(payload, caller);
                break;
            case 'show-alert':
                payload.alert = true;
                openDialog(payload, caller);
                break;
            case 'close-dialog':
                closeDialog('closed');
                break;
            case 'show-loading':
                loading.querySelector('span').textContent = payload.text || text.loading;
                loading.classList.add('show');
                break;
            case 'hide-loading':
                loading.classList.remove('show');
                break;
            case 'show-toast':
                showToast(payload.text || text[payload.key] || '', payload.ms);
                break;
        }
    }

    // 大廳傳來的訊息 約定格式 { source: 'host', type, payload }
    function handle(message) {
        if (!message || message.source !== 'host') return;
        var payload = message.payload || {};
        if (COMMANDS.indexOf(message.type) >= 0) {
            execute(message.type, payload, 'host');
            return;
        }
        switch (message.type) {
            case 'init':
                if (payload.strings) Object.assign(text, payload.strings);
                if (payload.safe) applySafe(payload.safe);
                if (payload.settings) {
                    settings.music = toSwitch(payload.settings.music, settings.music);
                    settings.sound = toSwitch(payload.settings.sound, settings.sound);
                }
                if (payload.tableId != null) currentSeatId = String(payload.tableId);
                if (payload.exitButton === 'none') menuBtn.classList.add('hidden');
                if (payload.exitButton === 'right') menuBtn.classList.add('right');
                applyText();
                break;
            case 'safe':
                applySafe(payload);
                break;
        }
    }

    // 遊戲傳來的訊息 約定格式 { source: 'game', type, payload }
    function handleGame(message) {
        var payload = message.payload || {};
        // 舊的 exit 等同 show-exit
        var type = message.type === 'exit' ? 'show-exit' : message.type;
        if (COMMANDS.indexOf(type) >= 0) {
            execute(type, payload, 'game');
            return;
        }
        switch (type) {
            case 'hi':
                // 遊戲啟動得比 load 事件晚 它主動問就補回握手
                sendHello();
                break;
            case 'ready':
                hideCover('ready');
                emit('game-ready', payload);
                break;
            case 'loading':
                coverSub.textContent = typeof payload.percent === 'number' ? Math.round(payload.percent) + '%' : '';
                break;
            case 'error':
                emit('game-error', payload);
                break;
        }
    }

    // 網頁版 postMessage
    window.addEventListener('message', function (event) {
        if (gameFrame && event.source === gameFrame.contentWindow) {
            // return.html 的回傳 與遊戲自己傳的訊息
            if (event.data && event.data.source === 'host-shell-return') emit('exit-confirm', { via: 'return_url' });
            else if (event.data && event.data.source === 'game') handleGame(event.data);
            return;
        }
        if (bridge === 'post' && event.source !== window.parent) return;
        handle(event.data);
    });

    // 原生 WebView evaluateJS 入口
    window.__hostShell = {
        receive: function (message) { handle(typeof message === 'string' ? JSON.parse(message) : message); }
    };

    menuBtn.addEventListener('click', showSystemMenu);
    dlgOk.addEventListener('click', function () { closeDialog('ok'); });
    dlgCancel.addEventListener('click', function () { closeDialog('cancel'); });
    // 點彈窗外面關閉 跟 Cocos 版 PopupProperty 的遮罩一樣
    popupLayer.addEventListener('click', function (event) {
        if (event.target === popupLayer) closePopup('outside');
    });
    window.addEventListener('resize', layoutPopup);
    window.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        if (currentPopup) closePopup('escape');
        else if (!mask.classList.contains('show')) showSystemMenu();
    });

    if (gameUrl) {
        document.body.classList.add('has-game');
        gameFrame = document.createElement('iframe');
        gameFrame.id = 'game';
        gameFrame.setAttribute('allow', 'autoplay; fullscreen; clipboard-write');
        // 不給 allow-top-navigation 避免對方把殼頁導走
        if (query.get('sandbox') !== '0') {
            gameFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock allow-orientation-lock');
        }
        gameFrame.addEventListener('load', function () {
            emit('game-loaded');
            // 先打招呼 遊戲想要的話可以用 host-sdk.js 接
            sendHello();
            // 同網域的遊戲 補上大廳的共用介面 遊戲按選單時開殼頁的系統選單 跨網域取不到就略過
            try {
                var scope = gameFrame.contentWindow;
                scope.__subGameShowSystemMenu__ = function () { showSystemMenu(); return Promise.resolve(); };
                scope.__subGameShowAutoPlaySelector__ = function () { return new Promise(function (resolve) { showAutoPlay({}, 'game', resolve); }); };
                scope.__subGameReselectTable__ = function () { showSeatLobby({}); return Promise.resolve(); };
            } catch (error) {
                // 跨網域的遊戲沒有這個介面
            }
            // 沒收到 ready 的遊戲 載入後再蓋一段時間
            var seconds = coverMode === 'wait' ? 30 : Number(coverMode);
            if (!isFinite(seconds)) seconds = 8;
            coverTimer = setTimeout(function () { hideCover('timeout'); }, seconds * 1000);
        });
        gameFrame.src = gameUrl;
        document.body.insertBefore(gameFrame, document.body.firstChild);
    } else {
        // 沒有網址就只出彈窗 不顯示選單鈕
        menuBtn.classList.add('hidden');
    }

    applyText();
    emit('ready', { hasGame: !!gameUrl });
})();
</script>
</body>
</html>
