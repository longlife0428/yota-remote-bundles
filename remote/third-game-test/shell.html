<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="normal">
<title>host shell</title>
<style>
:root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
body.has-game { background: #000; }

#game { position: fixed; top: var(--sat); right: var(--sar); bottom: var(--sab); left: var(--sal); width: calc(100% - var(--sal) - var(--sar)); height: calc(100% - var(--sat) - var(--sab)); border: 0; background: #000; }

/* 選單鈕 原本的退出鈕 位置與樣式沿用 內容換成三條線 */
#menu-btn { position: fixed; z-index: 10; top: calc(var(--sat) + 8px); left: calc(var(--sal) + 8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 44px; height: 32px; padding: 0; border: 1px solid rgba(255,255,255,.35); border-radius: 16px; background: rgba(0,0,0,.55); cursor: pointer; user-select: none; }
#menu-btn i { display: block; width: 16px; height: 2px; border-radius: 1px; background: #fff; }
#menu-btn.right { left: auto; right: calc(var(--sar) + 8px); }
#menu-btn.hidden { display: none; }

/* 系統選單 照 entry Core 的 SystemMenuPopup.prefab 一比一重做
   面板用素材原尺寸 1200x700 排版 座標換算自 prefab 再整塊縮放 Cocos 版外框本身就縮成 0.5 倍
   按鈕的顏色過渡 normal 214 hover 211 pressed 255 disabled 124 用 brightness 對應 只套在底圖上 */
#sysmenu { position: fixed; z-index: 15; inset: 0; display: none; }
#sysmenu.show { display: block; }
#sysmenu-panel { position: absolute; left: 50%; top: 50%; width: 1200px; height: 700px; margin: -350px 0 0 -600px; background: url(system-menu/Popups_bg01.png) no-repeat; background-size: 100% 100%; font-family: Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; color: #fff; user-select: none; }
#sysmenu-close { position: absolute; left: 1082px; top: -41px; width: 180px; height: 180px; padding: 0; border: 0; background: url(system-menu/Popups_cancel_button.png) no-repeat; background-size: 100% 100%; filter: brightness(.839); cursor: pointer; }
#sysmenu-close:hover { filter: brightness(.827); }
#sysmenu-close:active { filter: none; }
#sysmenu .title-en { position: absolute; left: 0; top: 35px; width: 1200px; height: 52px; font-size: 52px; line-height: 52px; font-weight: 700; text-align: center; color: rgb(248,236,205); white-space: nowrap; }
#sysmenu .title { position: absolute; left: 0; top: 100.5px; width: 1200px; height: 73px; font-size: 60px; line-height: 73px; font-weight: 700; text-align: center; white-space: nowrap; }
#sysmenu-list { position: absolute; left: 112.5px; top: 215px; display: grid; grid-template-columns: 470px 470px; gap: 25px 35px; }
#sysmenu .row { position: relative; width: 470px; height: 120px; cursor: pointer; }
#sysmenu .row.wide { grid-column: 1 / 3; width: 975px; }
#sysmenu .row::before { content: ''; position: absolute; inset: 0; border: 30px solid transparent; border-image: url(system-menu/System_menu_options_bg.png) 30 fill stretch; filter: brightness(.839); }
#sysmenu .row:hover::before { filter: brightness(.827); }
#sysmenu .row:active::before { filter: none; }
#sysmenu .row.disabled { cursor: default; }
#sysmenu .row.disabled::before { filter: brightness(.486); }
#sysmenu .row .icon { position: absolute; left: .5px; top: 0; width: 133px; height: 120px; background-size: 100% 100%; }
#sysmenu .row.wide .icon { left: 1px; width: 131px; }
#sysmenu .row .name { position: absolute; left: 164px; top: 21px; width: 306px; height: 50px; font-size: 40px; line-height: 50px; font-weight: 700; white-space: nowrap; overflow: hidden; }
#sysmenu .row .desc { position: absolute; left: 164px; top: 72px; width: 306px; height: 24px; font-size: 20px; line-height: 24px; white-space: nowrap; overflow: hidden; }
#sysmenu .row.wide .name, #sysmenu .row.wide .desc { width: 811px; }
#sysmenu .row .switch { position: absolute; left: 350px; top: 16px; width: 100px; height: 44px; background: url(system-menu/System_menu_music_off_button.png) no-repeat; background-size: 100% 100%; }
#sysmenu .row.on .switch { background-image: url(system-menu/System_menu_music_on_button.png); }
#sysmenu .row .disable { position: absolute; inset: 0; display: none; border: 30px solid transparent; border-image: url(system-menu/System_menu_options_enable.png) 30 fill stretch; }
#sysmenu .row.disabled .disable { display: block; }

#mask { position: fixed; z-index: 20; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
#mask.show { display: flex; }
#dialog { width: min(86vw, 360px); padding: 22px 20px 18px; border-radius: 12px; background: #253448; color: #fff; text-align: center; }
#dialog h1 { margin: 0 0 10px; font-size: 18px; font-weight: 600; }
#dialog p { margin: 0 0 18px; font-size: 15px; line-height: 1.5; color: #d8e0ea; white-space: pre-line; }
#dialog .row { display: flex; gap: 12px; }
#dialog button { flex: 1; height: 40px; border-radius: 20px; font-size: 15px; cursor: pointer; }
#dialog .cancel { border: 2px solid #797979; background: transparent; color: #fff; }
#dialog .ok { border: 0; background: #60c4cf; color: #0c1620; }

#loading { position: fixed; z-index: 30; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,.5); color: #fff; font-size: 15px; }
#loading.show { display: flex; }
#loading i { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#tag { position: fixed; z-index: 5; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; color: #fff; font-size: 36px; font-weight: 700; pointer-events: none; }
body.has-game #tag { display: flex; }
#tag.done { display: none !important; }
#tag small { font-size: 14px; font-weight: 400; opacity: .7; }

#toast { position: fixed; z-index: 40; left: 50%; bottom: calc(var(--sab) + 40px); max-width: 80vw; padding: 10px 16px; border-radius: 8px; background: rgba(0,0,0,.8); color: #fff; font-size: 14px; transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<button id="menu-btn" type="button"><i></i><i></i><i></i></button>
<div id="sysmenu">
    <div id="sysmenu-panel">
        <div class="title-en"></div>
        <div class="title"></div>
        <div id="sysmenu-list">
            <div class="row" data-action="music"><div class="icon" style="background-image:url(system-menu/System_menu_options_music_label.png)"></div><div class="name"></div><div class="desc"></div><div class="switch"></div><div class="disable"></div></div>
            <div class="row" data-action="sound"><div class="icon" style="background-image:url(system-menu/System_menu_options_fx_label.png)"></div><div class="name"></div><div class="desc"></div><div class="switch"></div><div class="disable"></div></div>
            <div class="row disabled" data-action="game-info"><div class="icon" style="background-image:url(system-menu/System_menu_options_info_label.png)"></div><div class="name"></div><div class="desc"></div><div class="disable"></div></div>
            <div class="row disabled" data-action="game-history"><div class="icon" style="background-image:url(system-menu/System_menu_options_info_label.png)"></div><div class="name"></div><div class="desc"></div><div class="disable"></div></div>
            <div class="row wide" data-action="leave"><div class="icon" style="background-image:url(system-menu/System_menu_options_exit_label.png)"></div><div class="name"></div><div class="desc"></div><div class="disable"></div></div>
        </div>
        <button id="sysmenu-close" type="button"></button>
    </div>
</div>
<div id="mask"><div id="dialog"><h1></h1><p></p><div class="row"><button class="cancel" type="button"></button><button class="ok" type="button"></button></div></div></div>
<div id="loading"><i></i><span></span></div>
<div id="toast"></div>
<div id="tag">shell page<small id="tag-sub"></small></div>
<script>
(function () {
    var query = new URLSearchParams(location.search);
    var gameUrl = query.get('url') || '';
    var scheme = query.get('scheme') || 'hostshell';
    // post = 內嵌在頁面裡用 postMessage  scheme = 原生 WebView 用網址回呼
    var bridge = query.get('bridge') || (window.parent !== window ? 'post' : 'scheme');
    var lang = query.get('lang') || 'zh-TW';
    // 自訂的遊戲代號 遊戲握手時一起回給它
    var gameId = query.get('gameId') || '';

    // menu 開頭的是系統選單 字串取自 entry Core 語系檔 zh-HK zh en 的 popup.systemMenu.*
    var TEXT = {
        'zh-TW': { menu: '選單', title: '離開遊戲', message: '確定要離開目前的遊戲嗎？', confirm: '確定離開', cancel: '取消', ok: '確定', loading: '處理中…', exitFailed: '退出失敗 請稍後再試',
            menuTitle: '遊戲選單', menuMusic: '音樂', menuMusicDesc: '背景音樂偏好', menuSound: '音效', menuSoundDesc: '按鈕與演出音效偏好', menuGameInfo: 'GAME INFO', menuGameInfoDesc: '玩法、賠付與操作說明', menuGameHistory: '遊戲紀錄', menuGameHistoryDesc: '遊戲紀錄尚未串接', menuLeave: '離開遊戲', menuLeaveDesc: '離開、保留或重新選座' },
        'zh-CN': { menu: '选单', title: '离开游戏', message: '确定要离开当前的游戏吗？', confirm: '确定离开', cancel: '取消', ok: '确定', loading: '处理中…', exitFailed: '退出失败 请稍后再试',
            menuTitle: '游戏选单', menuMusic: '音乐', menuMusicDesc: '背景音乐偏好', menuSound: '音效', menuSoundDesc: '按钮与演出音效偏好', menuGameInfo: 'GAME INFO', menuGameInfoDesc: '玩法、赔付与操作说明', menuGameHistory: '游戏记录', menuGameHistoryDesc: '游戏记录尚未串接', menuLeave: '离开游戏', menuLeaveDesc: '离开、保留或重新选座' },
        'en': { menu: 'Menu', title: 'Leave game', message: 'Leave the current game?', confirm: 'Leave', cancel: 'Cancel', ok: 'OK', loading: 'Please wait…', exitFailed: 'Exit failed. Please try again.',
            menuTitle: 'SYSTEM MENU', menuMusic: 'Music', menuMusicDesc: 'Background music preference', menuSound: 'SFX', menuSoundDesc: 'Button and animation sound preference', menuGameInfo: 'GAME INFO', menuGameInfoDesc: 'Rules, payouts and controls', menuGameHistory: 'History', menuGameHistoryDesc: 'Game history is not connected yet', menuLeave: 'Leave Game', menuLeaveDesc: 'Leave, keep your seat, or reselect' }
    };
    var text = Object.assign({}, TEXT[lang] || TEXT['zh-TW']);
    // 系統選單第一行標題固定英文 跟 Cocos 版 Title_en 一樣不跟語系走
    var MENU_TITLE_EN = 'SYSTEM MENU';
    // 音樂音效開關 大廳 init 帶 settings 進來 沒帶就當作開
    var settings = { music: true, sound: true };

    var menuBtn = document.getElementById('menu-btn');
    var sysMenu = document.getElementById('sysmenu');
    var sysMenuPanel = document.getElementById('sysmenu-panel');
    var sysMenuRows = {};
    Array.prototype.forEach.call(sysMenu.querySelectorAll('.row'), function (row) { sysMenuRows[row.getAttribute('data-action')] = row; });
    var mask = document.getElementById('mask');
    var dialog = document.getElementById('dialog');
    var dlgTitle = dialog.querySelector('h1');
    var dlgMessage = dialog.querySelector('p');
    var dlgCancel = dialog.querySelector('.cancel');
    var dlgOk = dialog.querySelector('.ok');
    var loading = document.getElementById('loading');
    var toast = document.getElementById('toast');
    var gameFrame = null;
    var cover = document.getElementById('tag');
    var coverSub = document.getElementById('tag-sub');
    // 遮罩模式 數字=網頁載入後再蓋幾秒 wait=只等遊戲回 ready 最多 30 秒
    var coverMode = query.get('cover') || '8';
    var coverTimer = 0;
    var dialogId = '';
    var toastTimer = 0;

    function emit(type, payload) {
        var message = { source: 'host-shell', type: type, payload: payload || {} };
        if (bridge === 'post') {
            window.parent.postMessage(message, '*');
        } else {
            location.href = scheme + '://' + type + '?d=' + encodeURIComponent(JSON.stringify(message));
        }
    }

    function setRowText(action, name, desc) {
        sysMenuRows[action].querySelector('.name').textContent = name;
        sysMenuRows[action].querySelector('.desc').textContent = desc;
    }

    function applyText() {
        menuBtn.setAttribute('aria-label', text.menu);
        sysMenuPanel.querySelector('.title-en').textContent = MENU_TITLE_EN;
        sysMenuPanel.querySelector('.title').textContent = text.menuTitle;
        setRowText('music', text.menuMusic, text.menuMusicDesc);
        setRowText('sound', text.menuSound, text.menuSoundDesc);
        setRowText('game-info', text.menuGameInfo, text.menuGameInfoDesc);
        setRowText('game-history', text.menuGameHistory, text.menuGameHistoryDesc);
        setRowText('leave', text.menuLeave, text.menuLeaveDesc);
    }

    function applySettings() {
        sysMenuRows.music.classList.toggle('on', settings.music);
        sysMenuRows.sound.classList.toggle('on', settings.sound);
    }

    // 數字照 Cocos SettingStore 的音量 大於 0 算開
    function toSwitch(value, fallback) {
        if (value == null) return fallback;
        return typeof value === 'number' ? value > 0 : !!value;
    }

    // 外框在 Cocos 版是 1280x720 設計框裡縮成 0.5 倍 這裡照同一個比例跟著視窗等比縮放
    function layoutSystemMenu() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var fit = w >= h ? Math.min(w / 1280, h / 720) : Math.min(w / 720, h / 1280);
        sysMenuPanel.style.transform = 'scale(' + (fit * 0.5) + ')';
    }

    function showSystemMenu() {
        layoutSystemMenu();
        sysMenu.classList.add('show');
    }

    function hideSystemMenu() {
        sysMenu.classList.remove('show');
    }

    // 音樂音效 大廳寫回自己的設定 遊戲要聽的話用 host-sdk 的 onHost 接 setting
    function toggleSetting(key) {
        settings[key] = !settings[key];
        applySettings();
        var payload = { music: settings.music, sound: settings.sound };
        emit('setting-change', payload);
        if (gameFrame) gameFrame.contentWindow.postMessage({ source: 'host-shell', type: 'setting', payload: payload }, '*');
    }

    function onSystemMenuRow(action) {
        switch (action) {
            case 'music':
                toggleSetting('music');
                break;
            case 'sound':
                toggleSetting('sound');
                break;
            case 'leave':
                // 跟 Cocos 版一樣 先關選單再開退出確認
                hideSystemMenu();
                showExitConfirm();
                break;
        }
    }

    function applySafe(safe) {
        var root = document.documentElement.style;
        if (safe.top != null) root.setProperty('--sat', safe.top + 'px');
        if (safe.right != null) root.setProperty('--sar', safe.right + 'px');
        if (safe.bottom != null) root.setProperty('--sab', safe.bottom + 'px');
        if (safe.left != null) root.setProperty('--sal', safe.left + 'px');
    }

    // 遮罩隱藏原因 ready 遊戲通知 timeout 逾時
    function hideCover(reason) {
        if (cover.classList.contains('done')) return;
        cover.classList.add('done');
        clearTimeout(coverTimer);
        emit('cover-hidden', { reason: reason });
    }

    // 握手 告訴遊戲殼頁在 以及它的代號與語言
    function sendHello() {
        gameFrame.contentWindow.postMessage({ source: 'host-shell', type: 'hello', payload: { gameId: gameId, lang: lang, settings: { music: settings.music, sound: settings.sound } } }, '*');
    }

    // 大廳與遊戲都能呼叫的指令 同一套名稱同一套參數
    var COMMANDS = ['show-system-menu', 'show-exit', 'show-confirm', 'show-alert', 'close-dialog', 'show-loading', 'hide-loading', 'show-toast'];
    // 目前彈窗是誰叫的 host 或 game 結果回給它
    var dialogCaller = 'host';

    function openDialog(options, caller) {
        dialogId = options.id || '';
        dialogCaller = caller || 'host';
        dlgTitle.textContent = options.title || '';
        dlgMessage.textContent = options.message || '';
        dlgOk.textContent = options.confirm || text.ok;
        dlgCancel.textContent = options.cancel || text.cancel;
        dlgCancel.style.display = options.alert ? 'none' : '';
        mask.classList.add('show');
        emit('dialog-open', { id: dialogId });
    }

    function closeDialog(result) {
        if (!mask.classList.contains('show')) return;
        mask.classList.remove('show');
        var id = dialogId;
        var caller = dialogCaller;
        dialogId = '';
        emit('dialog-close', { id: id, result: result });
        if (caller === 'game' && gameFrame) {
            gameFrame.contentWindow.postMessage({ source: 'host-shell', type: 'dialog-result', payload: { id: id, result: result } }, '*');
        }
        // 退出確認 不管誰叫的 都通知大廳決定要不要離開
        if (id === 'exit') {
            if (result === 'ok') emit('exit-confirm', { via: 'dialog' });
            else emit('exit-cancel');
        }
    }

    function showToast(message, ms) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, ms || 2000);
    }

    function execute(type, payload, caller) {
        switch (type) {
            case 'show-system-menu':
                showSystemMenu();
                break;
            case 'show-exit':
                openDialog({ id: 'exit', title: text.title, message: text.message, confirm: text.confirm, cancel: text.cancel }, caller);
                break;
            case 'show-confirm':
                openDialog(payload, caller);
                break;
            case 'show-alert':
                payload.alert = true;
                openDialog(payload, caller);
                break;
            case 'close-dialog':
                closeDialog('closed');
                break;
            case 'show-loading':
                loading.querySelector('span').textContent = payload.text || text.loading;
                loading.classList.add('show');
                break;
            case 'hide-loading':
                loading.classList.remove('show');
                break;
            case 'show-toast':
                showToast(payload.text || text[payload.key] || '', payload.ms);
                break;
        }
    }

    function showExitConfirm() {
        execute('show-exit', {}, 'host');
    }

    // 大廳傳來的訊息 約定格式 { source: 'host', type, payload }
    function handle(message) {
        if (!message || message.source !== 'host') return;
        var payload = message.payload || {};
        if (COMMANDS.indexOf(message.type) >= 0) {
            execute(message.type, payload, 'host');
            return;
        }
        switch (message.type) {
            case 'init':
                if (payload.strings) Object.assign(text, payload.strings);
                if (payload.safe) applySafe(payload.safe);
                if (payload.settings) {
                    settings.music = toSwitch(payload.settings.music, settings.music);
                    settings.sound = toSwitch(payload.settings.sound, settings.sound);
                    applySettings();
                }
                if (payload.exitButton === 'none') menuBtn.classList.add('hidden');
                if (payload.exitButton === 'right') menuBtn.classList.add('right');
                applyText();
                break;
            case 'safe':
                applySafe(payload);
                break;
        }
    }

    // 遊戲傳來的訊息 約定格式 { source: 'game', type, payload }
    function handleGame(message) {
        var payload = message.payload || {};
        // 舊的 exit 等同 show-exit
        var type = message.type === 'exit' ? 'show-exit' : message.type;
        if (COMMANDS.indexOf(type) >= 0) {
            execute(type, payload, 'game');
            return;
        }
        switch (type) {
            case 'hi':
                // 遊戲啟動得比 load 事件晚 它主動問就補回握手
                sendHello();
                break;
            case 'ready':
                hideCover('ready');
                emit('game-ready', payload);
                break;
            case 'loading':
                coverSub.textContent = typeof payload.percent === 'number' ? Math.round(payload.percent) + '%' : '';
                break;
            case 'error':
                emit('game-error', payload);
                break;
        }
    }

    // 網頁版 postMessage
    window.addEventListener('message', function (event) {
        if (gameFrame && event.source === gameFrame.contentWindow) {
            // return.html 的回傳 與遊戲自己傳的訊息
            if (event.data && event.data.source === 'host-shell-return') emit('exit-confirm', { via: 'return_url' });
            else if (event.data && event.data.source === 'game') handleGame(event.data);
            return;
        }
        if (bridge === 'post' && event.source !== window.parent) return;
        handle(event.data);
    });

    // 原生 WebView evaluateJS 入口
    window.__hostShell = {
        receive: function (message) { handle(typeof message === 'string' ? JSON.parse(message) : message); }
    };

    menuBtn.addEventListener('click', showSystemMenu);
    dlgOk.addEventListener('click', function () { closeDialog('ok'); });
    dlgCancel.addEventListener('click', function () { closeDialog('cancel'); });
    // 點選單外面或右上角 X 關閉 跟 Cocos 版的遮罩與關閉鈕一樣
    sysMenu.addEventListener('click', function (event) {
        if (event.target === sysMenu) hideSystemMenu();
    });
    document.getElementById('sysmenu-close').addEventListener('click', hideSystemMenu);
    // 不能點的列不反應 GAME INFO 與遊戲紀錄目前都是這樣
    Object.keys(sysMenuRows).forEach(function (action) {
        sysMenuRows[action].addEventListener('click', function () {
            if (!sysMenuRows[action].classList.contains('disabled')) onSystemMenuRow(action);
        });
    });
    window.addEventListener('resize', layoutSystemMenu);
    window.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        if (sysMenu.classList.contains('show')) hideSystemMenu();
        else if (!mask.classList.contains('show')) showSystemMenu();
    });

    if (gameUrl) {
        document.body.classList.add('has-game');
        gameFrame = document.createElement('iframe');
        gameFrame.id = 'game';
        gameFrame.setAttribute('allow', 'autoplay; fullscreen; clipboard-write');
        // 不給 allow-top-navigation 避免對方把殼頁導走
        if (query.get('sandbox') !== '0') {
            gameFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock allow-orientation-lock');
        }
        gameFrame.addEventListener('load', function () {
            emit('game-loaded');
            // 先打招呼 遊戲想要的話可以用 host-sdk.js 接
            sendHello();
            // 同網域的遊戲 補上大廳的共用介面 遊戲按選單時開殼頁的系統選單 跨網域取不到就略過
            try {
                gameFrame.contentWindow.__subGameShowSystemMenu__ = function () { showSystemMenu(); return Promise.resolve(); };
            } catch (error) {
                // 跨網域的遊戲沒有這個介面
            }
            // 沒收到 ready 的遊戲 載入後再蓋一段時間
            var seconds = coverMode === 'wait' ? 30 : Number(coverMode);
            if (!isFinite(seconds)) seconds = 8;
            coverTimer = setTimeout(function () { hideCover('timeout'); }, seconds * 1000);
        });
        gameFrame.src = gameUrl;
        document.body.insertBefore(gameFrame, document.body.firstChild);
    } else {
        // 沒有網址就只出彈窗 不顯示選單鈕
        menuBtn.classList.add('hidden');
    }

    applyText();
    applySettings();
    emit('ready', { hasGame: !!gameUrl });
})();
</script>
</body>
</html>
